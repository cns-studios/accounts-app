# Production release: pushing a tag vMAJOR.MINOR.PATCH builds the signed release APK from that
# tag and publishes it as a GitHub release, with its SHA-256. The app's update check reads the
# latest release (app/src/main/java/com/cns/accounts/data/update/AppUpdates.kt).
#
# Repository secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
#   RELEASE_KEY_PASSWORD.
# Repository variables: RELEASE_CERT_SHA256 (the signing certificate's SHA-256, checked against
#   the built APK), FIREBASE_APP_ID, FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_SENDER_ID.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Release tags look like v1.2.3 (minor and patch below 100), got $tag"
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CNS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          CNS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CNS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CNS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon :app:assembleRelease
          -PcnsVersionName=${{ steps.version.outputs.name }}
          -PcnsFirebaseAppId=${{ vars.FIREBASE_APP_ID }}
          -PcnsFirebaseApiKey=${{ vars.FIREBASE_API_KEY }}
          -PcnsFirebaseProjectId=${{ vars.FIREBASE_PROJECT_ID }}
          -PcnsFirebaseSenderId=${{ vars.FIREBASE_SENDER_ID }}

      - name: Verify the signature
        env:
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose "$apk"
          # "Signer #1 certificate SHA-256 digest: ..." or "V2 Signer: certificate SHA-256 digest: ...",
          # depending on the build-tools version; every signer must use the one release certificate.
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)"
          expected="$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with $actual, expected $expected"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          out="cns-accounts-$VERSION.apk"
          mv app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          gh release create "$GITHUB_REF_NAME" "$out" "$out.sha256" \
            --verify-tag --title "CNS Accounts $VERSION" --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
